<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="cardsPageTitle">Homework Buddy · Flashcards</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.45 system-ui, sans-serif; color: #2b2d42; background: linear-gradient(160deg, #fff4e6, #e3f6ff); }
  main { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 20px; text-align: center; }
  h1, p { margin: 0; }
  p { opacity: .8; }
  button { font: inherit; border: 0; cursor: pointer; }
  .deck { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
  .card { width: 200px; height: 280px; padding: 0; background: none; perspective: 900px; }
  .flip { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .6s; }
  .card:hover .flip { transform: translateY(-6px); }
  .card.picked .flip { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; border-radius: 18px; backface-visibility: hidden; box-shadow: 0 8px 20px rgba(43, 45, 66, .18); }
  .cover { background: #ff7a59; color: #fff; font-size: 72px; }
  .front { background: #fff; color: #2b2d42; font-size: 20px; transform: rotateY(180deg); }
  #go { padding: 14px 28px; border-radius: 999px; background: #2ec4b6; color: #fff; font-size: 18px; }
  #go:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <h1 data-i18n="pickTitle"></h1>
  <p data-i18n="pickHint"></p>
  <div class="deck" id="deck"></div>
  <button id="go" data-i18n="practice" disabled></button>
</main>
<script type="module" src="cards.js"></script>
</body>
</html>
